name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token for every job; individual jobs re-declare if they need more
permissions:
  contents: read

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week3-containers-api/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: week3-containers-api/api/package.json
      - run: npm install
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shortener-api week3-containers-api/api
      - name: Smoke test image starts and is non-root
        run: |
          test "$(docker run --rm shortener-api whoami)" = "node"
          docker run --rm shortener-api node -e "require('./src/app'); console.log('app loads')"

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir:
          - bootstrap
          - modules/network
          - week1-static-site/terraform
          - week2-vpc-lab/terraform
          - week3-containers-api/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
        working-directory: ${{ matrix.dir }}
      - run: terraform init -backend=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy IaC + secrets scan
        run: trivy fs --scanners misconfig,secret --exit-code 1 --severity HIGH,CRITICAL .
